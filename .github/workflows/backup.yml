# Daily encrypted database backup (ARCHITECTURE §19, task L3; restore steps in RUNBOOK.md §6).
#
# Off until the owner adds two repository secrets (Settings → Secrets and variables → Actions):
#   BACKUP_DATABASE_URL  a read-only connection string to the production database
#                        (postgresql://user:password@host/db?sslmode=require), not the app's
#   BACKUP_PASSPHRASE    a long random passphrase, also kept by the owner outside GitHub
# Without them the job says so and stops, green.
#
# SECURITY: the dump is encrypted (GPG, AES-256) before it is stored, so the artifact never holds
# readable lead data; artifacts are kept 30 days. The PostgreSQL client matches production (18).
name: Backup

on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the backup is set up
        id: setup
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backups are off: add BACKUP_DATABASE_URL and BACKUP_PASSPHRASE (RUNBOOK.md §6)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dump and encrypt
        if: steps.setup.outputs.ready == 'true'
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          mkdir -p backup
          docker run --rm -e BACKUP_DATABASE_URL pgvector/pgvector:pg18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges "$BACKUP_DATABASE_URL"' \
            | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
                --symmetric --cipher-algo AES256 -o "backup/empire-$stamp.dump.gpg" \
                3<<<"$BACKUP_PASSPHRASE"
          test -s "backup/empire-$stamp.dump.gpg"
          ls -l backup
      - name: Keep for 30 days
        if: steps.setup.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-backup
          path: backup/
          retention-days: 30
          if-no-files-found: error
