components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      description: RFC 9457 problem details. Every error uses this shape.
      required:
      - title
      - status
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        pages:
          type: integer
          minimum: 0
      required:
      - page
      - per_page
      - total
      - pages
    Area:
      type: object
      properties:
        min_sqm:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        max_sqm:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        basis:
          type: string
          enum:
          - carpet
          - builtup
          - super_builtup
          - plot
        display_unit:
          type: string
          enum:
          - sqft
          - sqyd
          - sqm
        display:
          type: string
          readOnly: true
          examples:
          - 1,150 – 1,420 sq ft (carpet)
      description: Stored in square metres; shown in display_unit.
    Price:
      type: object
      properties:
        on_request:
          type: boolean
          default: false
        min_inr:
          anyOf:
          - type: integer
            minimum: 0
            description: Whole rupees
          - type: 'null'
        max_inr:
          anyOf:
          - type: integer
            minimum: 0
            description: Whole rupees
          - type: 'null'
        rate_inr:
          anyOf:
          - type: integer
            minimum: 0
            description: Whole rupees
          - type: 'null'
        rate_unit:
          anyOf:
          - type: string
            enum:
            - sqft
            - sqyd
            - sqm
          - type: 'null'
        note:
          anyOf:
          - type: string
            maxLength: 160
            examples:
            - + GST and registration
          - type: 'null'
        display:
          type: string
          readOnly: true
          examples:
          - ₹ 85 L – ₹ 1.25 Cr
      description: Total price range and/or rate per unit area. on_request hides numbers.
    Seo:
      type: object
      properties:
        title:
          anyOf:
          - type: string
            maxLength: 70
          - type: 'null'
        description:
          anyOf:
          - type: string
            maxLength: 170
          - type: 'null'
        og_image_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        noindex:
          type: boolean
          default: false
        canonical_path:
          anyOf:
          - type: string
          - type: 'null'
    Translations:
      type: object
      description: 'Per-locale overlay of translatable fields, e.g. {"hi": {"name": "…"}}. English lives in the base fields.'
      additionalProperties:
        type: object
        additionalProperties:
          type: string
    CityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        state:
          type: string
      required:
      - id
      - name
      - slug
    LocalityRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      required:
      - id
      - name
      - slug
    Location:
      type: object
      properties:
        address_line:
          anyOf:
          - type: string
          - type: 'null'
        city:
          anyOf:
          - $ref: '#/components/schemas/CityRef'
          - type: 'null'
        locality:
          anyOf:
          - $ref: '#/components/schemas/LocalityRef'
          - type: 'null'
        state:
          type: string
          examples:
          - Uttar Pradesh
        pincode:
          anyOf:
          - type: string
            pattern: ^[1-9][0-9]{5}$
          - type: 'null'
        lat:
          anyOf:
          - type: number
            minimum: -90
            maximum: 90
          - type: 'null'
        lng:
          anyOf:
          - type: number
            minimum: -180
            maximum: 180
          - type: 'null'
        google_maps_url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        plus_code:
          anyOf:
          - type: string
          - type: 'null'
        pin_source:
          anyOf:
          - type: string
            enum:
            - url
            - plus_code
            - manual
          - type: 'null'
        directions_url:
          type: string
          format: uri
          readOnly: true
    LocationInput:
      type: object
      properties:
        address_line:
          anyOf:
          - type: string
            maxLength: 300
          - type: 'null'
        city_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        locality_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        state:
          type: string
          maxLength: 60
        pincode:
          anyOf:
          - type: string
            pattern: ^[1-9][0-9]{5}$
          - type: 'null'
        lat:
          anyOf:
          - type: number
          - type: 'null'
        lng:
          anyOf:
          - type: number
          - type: 'null'
        google_maps_url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        plus_code:
          anyOf:
          - type: string
          - type: 'null'
    Media:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - image
          - video
          - document
        url:
          type: string
          format: uri
        thumbnail_url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        title:
          type: string
        alt_text:
          anyOf:
          - type: string
          - type: 'null'
        format:
          type: string
          examples:
          - jpg
          - mp4
          - pdf
        bytes:
          type: integer
        width:
          anyOf:
          - type: integer
          - type: 'null'
        height:
          anyOf:
          - type: integer
          - type: 'null'
        duration_s:
          anyOf:
          - type: number
          - type: 'null'
        created_at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - url
      - title
      - format
      - bytes
    LinkedMedia:
      allOf:
      - $ref: '#/components/schemas/Media'
      - type: object
        properties:
          link_id:
            type: string
            format: uuid
          role:
            type: string
            enum:
            - gallery
            - floor_plan
            - brochure
            - rera_qr
            - video
            - document
            - hero
            - og_image
          sort_order:
            type: integer
          is_cover:
            type: boolean
          is_visible:
            type: boolean
        required:
        - link_id
        - role
        - sort_order
        - is_cover
        - is_visible
    Rera:
      type: object
      properties:
        authority:
          type: string
          examples:
          - UP-RERA
        number:
          anyOf:
          - type: string
          - type: 'null'
        url:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        qr:
          anyOf:
          - $ref: '#/components/schemas/Media'
          - type: 'null'
      description: Shown on every project page and ad block.
    FormattedText:
      type: string
      description: 'WhatsApp-style text: *bold*, _italic_, ''-'' bullets with two-space nesting. Rendered safely; raw HTML
        is never interpreted.'
    City:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        state:
          type: string
        project_count:
          type: integer
          readOnly: true
      required:
      - id
      - name
      - slug
      - state
    CityInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        state:
          type: string
          maxLength: 60
      required:
      - name
      - state
    Locality:
      type: object
      properties:
        id:
          type: string
          format: uuid
        city_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      required:
      - id
      - city_id
      - name
      - slug
    LocalityInput:
      type: object
      properties:
        city_id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      required:
      - city_id
      - name
    Amenity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
        icon:
          type: string
          description: Icon key from the design system
        category:
          type: string
          enum:
          - lifestyle
          - sports
          - kids
          - security
          - green
          - convenience
          - other
      required:
      - id
      - name
      - slug
      - icon
      - category
    AmenityInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        icon:
          type: string
        category:
          type: string
      required:
      - name
      - icon
      - category
    Tower:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum:
          - tower
          - phase
          - block
          - wing
        floors:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        units_count:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        status:
          type: string
          enum:
          - planned
          - under_construction
          - completed
        rera_number:
          anyOf:
          - type: string
            description: Only if this phase has its own registration
          - type: 'null'
        possession_date:
          anyOf:
          - type: string
            format: date
          - type: 'null'
        progress_percent:
          anyOf:
          - type: integer
