openapi: 3.1.0
info:
  title: Empire API
  version: 1.0.0-design
  description: 'Design contract agreed in Phase 1 (18 Oct 2026). From Phase 3, FastAPI generates the live spec from code;
    differences are resolved in favour of this file unless a decision record says otherwise.


    **Rules**

    - The browser calls `/api/*` on the site; Next.js rewrites to the API. The API never redirects: every path works with
    or without a trailing slash (redirect_slashes off, path normalised before routing).

    - Errors use RFC 9457 problem+json.

    - Staff calls use the `__Host-empire_session` cookie. Writes also send `X-CSRF-Token` (from /auth/me).

    - Lists page with `page` / `per_page` (max 100). Leads list newest first.

    - `x-permission` names the permission an operation needs (see docs/ARCHITECTURE.md §11).

    - Sample records (`is_sample`) are never returned by public endpoints in production.'
servers:
- url: https://empirebuildcon.com
  description: Production (through the site's /api proxy)
- url: http://localhost:3000
  description: Local web app (proxy)
- url: http://localhost:8000
  description: Local API directly
tags:
- name: System
- name: Auth
- name: Public
- name: Lead intake
- name: AI
- name: Dashboard
- name: Projects
- name: Catalogue
- name: Media
- name: Leads
- name: Content
- name: Marketing
- name: SEO
- name: Settings
- name: Integrations
- name: Users
- name: Internal
paths:
  /api/health:
    get:
      operationId: health
      tags:
      - System
      summary: Health check including the database (run after deploys)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /api/health/live:
    get:
      operationId: health_live
      tags:
      - System
      summary: Liveness only, no database (for uptime monitors, lets the database sleep)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
      security: []
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Sign in
      description: Sets the __Host-empire_session cookie (HttpOnly, Secure, SameSite=Lax). 5 failed attempts lock the account
        for 15 minutes; attempts are also limited per IP. Counters live in PostgreSQL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Sign out (revokes the session)
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
        csrfHeader: []
  /api/v1/auth/me:
    get:
      operationId: me
      tags:
      - Auth
      summary: Current user, permissions and CSRF token
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - cookieAuth: []
  /api/v1/auth/password/forgot:
    post:
      operationId: password_forgot
      tags:
      - Auth
      summary: Email a reset link (same reply whether or not the email exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgot'
      responses:
        '204':
          description: Done
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /api/v1/auth/password/reset:
    post:
      operationId: password_reset
      tags:
      - Auth
      summary: Set a new password with a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordReset'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
  /api/v1/auth/password/change:
    post:
      operationId: password_change
      tags:
      - Auth
      summary: Change own password (revokes other sessions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
        csrfHeader: []
  /api/v1/public/site:
    get:
      operationId: public_site
      tags:
      - Public
      summary: Company details, nav, public flags, consent texts, active offers
      parameters:
      - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSite'
      security: []
  /api/v1/public/projects:
    get:
      operationId: public_list_projects
      tags:
      - Public
      summary: Search projects (available first, then sold out; off-market hidden)
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/locale'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - upcoming
          - ongoing
          - completed
      - name: city
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      - name: locality
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      - name: type
        in: query
        schema:
          type: string
          enum:
          - apartment
          - villa
          - plot
          - penthouse
          - shop
          - office
          - other
      - name: bhk
        in: query
        schema:
          type: number
      - name: budget_min
        in: query
        schema:
          type: integer
          minimum: 0
          description: Whole rupees
      - name: budget_max
        in: query
        schema:
          type: integer
          minimum: 0
          description: Whole rupees
      - name: featured
        in: query
        schema:
          type: boolean
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recommended
          - price_asc
          - price_desc
          - possession
          - newest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - items
                - meta
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /api/v1/public/projects/{slug}:
    get:
      operationId: public_get_project
      tags:
      - Public
      summary: Project detail
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /api/v1/public/projects/{slug}/configurations/{config_slug}:
    get:
      operationId: public_get_property
      tags:
      - Public
      summary: Property (configuration) detail
      parameters:
      - $ref: '#/components/parameters/slug'
      - name: config_slug
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Configuration'
                - type: object
                  properties:
                    project:
                      $ref: '#/components/schemas/ProjectSummary'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /api/v1/public/properties:
    get:
      operationId: public_list_properties
      tags:
      - Public
      summary: Search properties (configurations) across projects
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/locale'
      - name: city
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      - name: locality
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      - name: type
        in: query
        schema:
          type: string
          enum:
          - apartment
          - villa
          - plot
          - penthouse
          - shop
          - office
          - other
      - name: bhk
        in: query
        schema:
          type: number
      - name: budget_min
        in: query
        schema:
          type: integer
          minimum: 0
          description: Whole rupees
      - name: budget_max
        in: query
        schema:
          type: integer
          minimum: 0
          description: Whole rupees
      - name: project_status
        in: query
        schema:
          type: string
          enum:
          - upcoming
          - ongoing
          - completed
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - recommended
          - price_asc
          - price_desc
          - size_desc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PropertySummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - items
                - meta
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /api/v1/public/cities:
    get:
      operationId: public_list_cities
      tags:
      - Public
      summary: Cities with published projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
      security: []
  /api/v1/public/pages/{slug}:
    get:
      operationId: public_get_page
      tags:
      - Public
      summary: Published page with blocks (incl. legal and landing pages)
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /api/v1/public/posts:
    get:
      operationId: public_list_posts
      tags:
      - Public
      summary: Blog and news
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/locale'
      - name: category
        in: query
        schema:
          type: string
      - name: tag
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - items
                - meta
      security: []
  /api/v1/public/posts/{slug}:
    get:
      operationId: public_get_post
      tags:
      - Public
      summary: Article
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /api/v1/public/faqs:
    get:
      operationId: public_list_faqs
      tags:
      - Public
      summary: FAQs (site-wide, or for one project)
      parameters:
      - name: project
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      - $ref: '#/components/parameters/locale'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Faq'
      security: []
  /api/v1/public/testimonials:
    get:
      operationId: public_list_testimonials
      tags:
      - Public
      summary: Published, sourced testimonials
      parameters:
      - name: project
        in: query
        schema:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 120
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Testimonial'
      security: []
  /api/v1/public/redirects:
    get:
      operationId: public_list_redirects
      tags:
      - Public
      summary: Active redirects (read by the web app, cached)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Redirect'
      security: []
  /api/v1/public/sitemap:
    get:
      operationId: public_sitemap
      tags:
      - Public
      summary: All public URLs with last-modified (web app builds sitemap.xml)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SitemapEntry'
      security: []
  /api/v1/public/leads:
    post:
      operationId: submit_lead
      tags:
      - Lead intake
      summary: Submit an enquiry (general or for a project)
      description: Honeypot filled → 201 with a reference but the lead is stored as spam. Phone normalised to E.164 (+91).
        Consent text id + version must match the current published version.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      x-rate-limit: 5 per 10 minutes per IP and per phone; stored in PostgreSQL
  /api/v1/public/site-visits:
    post:
      operationId: request_site_visit
      tags:
      - Lead intake
      summary: Request a site visit (creates a lead and a visit request)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteVisitRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      x-rate-limit: 5 per 10 minutes per IP and per phone; stored in PostgreSQL
  /api/v1/public/brochure-requests:
    post:
      operationId: request_brochure
      tags:
      - Lead intake
      summary: Get the brochure link (lead form first when gated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrochureRequest'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrochureLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      x-rate-limit: 5 per 10 minutes per IP and per phone; stored in PostgreSQL
  /api/v1/ai/chat:
    post:
      operationId: ai_chat
      tags:
      - AI
      summary: Chat with the site assistant (feature flag chat_widget; 404 when off)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReply'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/TooMany'
      security: []
      x-feature-flag: chat_widget
      x-rate-limit: 20 messages per 10 minutes per visitor
  /api/v1/admin/dashboard:
    get:
      operationId: dashboard
      tags:
      - Dashboard
      summary: Counts that link to filtered lists, latest leads, upcoming visits, tasks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
      x-permission: dashboard.view
  /api/v1/admin/projects:
    get:
      operationId: list_projects
      tags:
      - Projects
      summary: List projects
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/q'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - upcoming
          - ongoing
          - completed
      - name: publish_state
        in: query
        schema:
          type: string
          enum:
          - draft
          - published
          - archived
      - name: sales_status
        in: query
        schema:
          type: string
          enum:
          - available
          - sold_out
          - off_market
      - name: city
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectSummary'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
                required:
                - items
                - meta
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
      x-permission: projects.read
    post:
      operationId: create_project
      tags:
      - Projects
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
        csrfHeader: []
      x-permission: projects.write
  /api/v1/admin/projects/{id}:
    get:
      operationId: get_project
      tags:
      - Projects
      summary: Get project
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
      x-permission: projects.read
    patch:
      operationId: update_project
      tags:
      - Projects
      summary: Update project
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAdmin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
        csrfHeader: []
      x-permission: projects.write
    delete:
      operationId: delete_project
      tags:
      - Projects
      summary: Delete project
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Done
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
      security:
      - cookieAuth: []
        csrfHeader: []
      x-permission: projects.delete
      description: Allowed only for drafts without leads; otherwise archive.
  /api/v1/admin/projects/{id}/publish:
    post:
      operationId: publish_project
      tags:
      - Projects
      summary: Publish (blocked until RERA number and QR are present)
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
