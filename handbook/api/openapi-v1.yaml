      - is_active
    WebhookEndpointInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        url:
          type: string
          format: uri
          description: https only; private IP ranges refused
        event_types:
          type: array
          items:
            type: string
          minItems: 1
        is_active:
          type: boolean
      required:
      - name
      - url
      - event_types
    WebhookEndpointCreated:
      allOf:
      - $ref: '#/components/schemas/WebhookEndpoint'
      - type: object
        properties:
          secret:
            type: string
            description: Shown once. Used for the X-Empire-Signature HMAC.
        required:
        - secret
    WebhookDelivery:
      type: object
      properties:
        id:
          type: integer
        event_type:
          type: string
        event_id:
          type: integer
        attempt:
          type: integer
        status_code:
          anyOf:
          - type: integer
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
        error:
          anyOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
        next_retry_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
    Integration:
      type: object
      properties:
        key:
          type: string
          enum:
          - email_alerts
          - whatsapp_alerts
          - meta_capi
          - google_ads
          - crm_webhook
          - gtm
        enabled:
          type: boolean
        configured:
          type: boolean
          readOnly: true
          description: Required environment secrets are present
        config:
          type: object
          description: Non-secret settings only. Secrets live in environment variables.
      required:
      - key
      - enabled
      - configured
    MapsResolveRequest:
      type: object
      properties:
        input:
          type: string
          maxLength: 500
          description: Google Maps link (long or maps.app.goo.gl), or a plus code
      required:
      - input
    MapsResolveResult:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        source:
          type: string
          enum:
          - url_coordinates
          - short_link
          - plus_code
        resolved_url:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - lat
      - lng
      - source
    ImageUpload:
      type: object
      properties:
        file:
          type: string
          format: binary
        title:
          type: string
        alt_text:
          type: string
        attach_to:
          type: string
          description: owner_type:owner_id, e.g. project:<uuid>
        role:
          type: string
      required:
      - file
    UploadSignatureRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - video
          - document
        filename:
          type: string
          maxLength: 200
        bytes:
          type: integer
          minimum: 1
        mime_type:
          type: string
      required:
      - kind
      - filename
      - bytes
      - mime_type
    UploadSignature:
      type: object
      properties:
        upload_url:
          type: string
          format: uri
        api_key:
          type: string
        timestamp:
          type: integer
        signature:
          type: string
        folder:
          type: string
        public_id:
          type: string
        resource_type:
          type: string
          enum:
          - video
          - raw
        max_bytes:
          type: integer
      required:
      - upload_url
      - api_key
      - timestamp
      - signature
      - public_id
      - resource_type
    UploadConfirm:
      type: object
      properties:
        cloudinary_response:
          type: object
          description: The JSON Cloudinary returned to the browser, unmodified
        title:
          type: string
        attach_to:
          anyOf:
          - type: string
          - type: 'null'
        role:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - cloudinary_response
    MediaUpdate:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        alt_text:
          anyOf:
          - type: string
            maxLength: 250
          - type: 'null'
    MediaLinkInput:
      type: object
      properties:
        media_id:
          type: string
          format: uuid
        attach_to:
          type: string
        role:
          type: string
        is_visible:
          type: boolean
          default: true
      required:
      - media_id
      - attach_to
      - role
    MediaLinkUpdate:
      type: object
      properties:
        is_visible:
          type: boolean
        is_cover:
          type: boolean
    ReorderRequest:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          description: Full new order; first image is the cover unless one is pinned
      required:
      - ids
    ChatRequest:
      type: object
      properties:
        conversation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        message:
          type: string
          maxLength: 2000
        page_url:
          type: string
      required:
      - message
      - page_url
    ChatReply:
      type: object
      properties:
        conversation_id:
          type: string
          format: uuid
        reply:
          type: string
        citations:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              path:
                type: string
        actions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                - open_whatsapp
                - show_lead_form
                - show_visit_form
              label:
                type: string
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        database:
          type: string
          enum:
          - ok
          - down
        version:
          type: string
        time:
          type: string
          format: date-time
      required:
      - status
      - database
    DrainResult:
      type: object
      properties:
        processed:
          type: integer
        failed:
          type: integer
        remaining:
          type: integer
  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    per_page:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
      description: Free-text search
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        maxLength: 120
    locale:
      name: locale
      in: query
      schema:
        type: string
        enum:
        - en
        - hi
        default: en
  responses:
    BadRequest:
      description: Bad request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Not signed in or session expired
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing permission or CSRF token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with current state (e.g. publish blockers, duplicate slug)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Invalid:
      description: Validation failed; see errors[]
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooMany:
      description: Rate limit hit; see Retry-After
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-empire_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    internalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: Shared secret for scheduler → API calls. Env var INTERNAL_API_KEY.
webhooks:
  outboxEvent:
    post:
      summary: Event delivered to a registered webhook endpoint
      description: 'Headers: X-Empire-Event, X-Empire-Delivery, X-Empire-Timestamp, X-Empire-Signature (hex HMAC-SHA256 of
        ''<timestamp>.<body>'' with the endpoint secret). Retried with backoff for 24 h on non-2xx.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                type:
                  type: string
                  examples:
                  - lead.created
                occurred_at:
                  type: string
                  format: date-time
                data:
                  type: object
              required:
              - id
              - type
              - occurred_at
              - data
      responses:
        2XX:
          description: Accepted
