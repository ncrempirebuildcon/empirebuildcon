# Empire API and worker (handbook/ARCHITECTURE.md §2, §4). Versions pinned exactly (D-006);
# Dependabot proposes updates weekly (.github/dependabot.yml).
[project]
name = "empire-api"
version = "0.1.0"
description = "Empire website and CMS: FastAPI app, background worker and admin CLI"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { text = "Proprietary" }
dependencies = [
    "fastapi==0.159.1",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "email-validator==2.3.0",
    "psycopg[binary]==3.3.6",
    "psycopg-pool==3.3.3",
    "pyjwt==2.15.1",
    "argon2-cffi==25.1.0",
    "structlog==26.1.0",
    "sentry-sdk==2.73.0",
    "cryptography==50.0.2",
    "typer==0.27.3",
    "uuid-utils==1.1.0",
    # The maps resolver follows Google short links on the server (projects/maps.py).
    "httpx==0.28.1",
    # Media (D-033): the official Cloudinary SDK (signing, upload, Admin API, delivery URLs),
    # Pillow to read photo dimensions and draw the SAMPLE tiles, and the multipart parser that
    # the capped upload reader streams through (media/multipart.py).
    "cloudinary==1.46.3",
    "pillow==13.0.0",
    "python-multipart==0.0.32",
    # Two-factor set-up (users/qr.py): the QR code as an inline SVG. Pure Python, no
    # dependencies, BSD. 1.6.6 (12 Mar 2025) was the newest on PyPI when checked, 25 Oct 2026.
    "segno==1.6.6",
]

[project.scripts]
empire-api = "empire_api.cli:app"
empire-worker = "empire_api.worker:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/empire_api"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "DTZ", "T20", "SIM", "RUF", "PL", "TID"]
ignore = [
    "PLR0913",  # FastAPI handlers legitimately take many injected parameters
    "PLR2004",  # magic values are fine in tests and HTTP status checks
    "B008",     # FastAPI's Depends() in defaults is the framework's pattern
    "PLR0917",  # same: handlers and services take request, db, actor, meta positionally
    "RUF001",   # prose uses typographic characters on purpose (₹, ·, –, →)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0915", "S311"]
"migrations/**" = ["N999", "E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["empire_api"]

[[tool.mypy.overrides]]
module = ["uuid_utils.*"]
ignore_missing_imports = true

# The Cloudinary SDK ships no type hints; media/cloudinary_store.py and signing.py wrap it.
[[tool.mypy.overrides]]
module = ["cloudinary", "cloudinary.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:empire_api.*"]
