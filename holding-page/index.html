<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empire · Delivering Happiness</title>
<meta name="description" content="Empire — Delivering Happiness. Our website is being built.">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Manrope:wght@400;500&display=swap">
<style>
  :root{--ivory:#FAF7F1;--ink:#2B2118;--body:#5A4C3C;--muted:#6E6050;--gold:#D9A441;--gold-700:#865A16}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ivory);color:var(--body);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right))}
  main{max-width:560px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
  img{width:min(320px,80vw);height:auto}
  h1{font-family:"Cinzel","Trajan Pro",Georgia,serif;font-weight:600;color:var(--ink);letter-spacing:.06em;font-size:clamp(22px,4vw,28px);margin:6px 0 0}
  .rule{display:flex;align-items:center;gap:12px;color:var(--gold);width:220px;font-size:12px}
  .rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .rule::after{background:linear-gradient(90deg,var(--gold),transparent)}
  p{margin:0;font-size:16px;line-height:1.6}
  small{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <img src="logo.webp" width="640" height="499" alt="Empire — Delivering Happiness">
  <h1>Our new website is on its way</h1>
  <div class="rule" aria-hidden="true">✦</div>
  <p>We're building a home online for Empire's projects. Please check back soon.</p>
  <small>empirebuildcon.com</small>
</main>
</body>
</html>
