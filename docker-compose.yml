# Local PostgreSQL for developers who don't have one installed (handbook/SETUP.md).
# Matches production: PostgreSQL 18 with the pgvector extension (D-006, D-013).
services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: empire # local only; never used outside your machine
      POSTGRES_DB: empire_dev
    ports:
      - "5432:5432"
    volumes:
      - empire-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U empire -d empire_dev"]
      interval: 5s
      retries: 10
volumes:
  empire-db:
